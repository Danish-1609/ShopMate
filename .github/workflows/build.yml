name: Build ShopMate APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Gradle (handles wrapper automatically - no gradle-wrapper.jar needed)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # 4. Make gradlew executable
      - name: Grant gradlew permission
        run: chmod +x gradlew

      # 5. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      # 6. Upload the APK so you can download it
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopMate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 7. Show build success info
      - name: Build Success
        run: |
          echo "✅ Build completed!"
          echo "📱 Download the APK from the Artifacts section above"
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null || echo "APK location shown above"
